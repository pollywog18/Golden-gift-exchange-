
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Gift Exchange</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #f5d778;
      font-family: Arial, sans-serif;
      padding: 25px 15px;
    }

    .container {
      max-width: 520px;
      margin: 25px auto;
      padding: 25px;
      background: #151515;
      border: 1px solid #b99135;
      border-radius: 16px;
      box-shadow: 0 0 25px #b9913525;
    }

    h1, h2 {
      text-align: center;
      color: #e8c45d;
    }

    h1 { font-size: 27px; }

    .subtitle {
      text-align: center;
      color: #c9c9c9;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #e8c45d;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      background: #080808;
      color: white;
      border: 1px solid #806727;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      background: linear-gradient(135deg, #f4d77b, #b58a29);
      color: #111;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .secondary {
      background: transparent;
      color: #e8c45d;
      border: 1px solid #b99135;
    }

    .section {
      margin-top: 28px;
      padding-top: 15px;
      border-top: 1px solid #66501f;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      color: white;
      background: #242424;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }

    .pin-list {
      color: white;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>✦ GOLDEN GIFT EXCHANGE ✦</h1>
    <p class="subtitle">A little mystery. A lot of magic.</p>

    <div id="organiserSection" class="section">
      <h2>Organiser Login</h2>
      <label>Email address</label>
      <input type="email" id="organiserEmail" placeholder="Enter your email">

      <button onclick="sendLoginLink()">Send Login Link</button>
      <div id="loginMessage" class="message hidden"></div>
    </div>

    <div id="adminPanel" class="section hidden">
      <h2>Organiser Dashboard</h2>

      <label>Exchange title</label>
      <input id="exchangeTitle" value="Golden Gift Exchange">

      <label>Gift budget</label>
      <input id="budget" placeholder="Example: $200">

      <label>Exchange date</label>
      <input type="date" id="exchangeDate">

      <label>Participant names</label>
      <textarea id="participants" placeholder="Enter one participant name per line"></textarea>

      <button onclick="createDraw()">Create Gift Draw</button>

      <div id="drawMessage" class="message hidden"></div>
      <div id="pinResults" class="message hidden"></div>

      <button class="secondary" onclick="logoutOrganiser()">Log Out</button>
    </div>

    <div class="section">
      <h2>Participant Login</h2>
      <p class="subtitle">Enter your name and private PIN to reveal your gift recipient.</p>

      <label>Your name</label>
      <input id="participantName" placeholder="Enter your name">

      <label>Your private PIN</label>
      <input id="participantPin" type="password" placeholder="Enter your PIN">

      <button onclick="revealResult()">Reveal My Recipient</button>

      <div id="participantMessage" class="message hidden"></div>
      <div id="result" class="message hidden"></div>

      <button id="hideResultButton" class="secondary hidden" onclick="hideResult()">
        Hide My Result
      </button>
    </div>
  </div>
<script>
  const SUPABASE_URL = "https://xcbgfyqlmcurxtivpfpy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_4zsJ-qenQFoPmXAdNUUMKg_OgtfIvBs";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const FUNCTION_NAME = "Secret-Santa";

  function showMessage(id, message) {
    const element = document.getElementById(id);
    element.textContent = message;
    element.classList.remove("hidden");
  }

  async function sendLoginLink() {
    const email = document.getElementById("organiserEmail").value.trim();

    if (!email) {
      showMessage("loginMessage", "Please enter your email address.");
      return;
    }

    const { error } = await supabaseClient.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: window.location.href
      }
    });

    if (error) {
      showMessage("loginMessage", error.message);
      return;
    }

    showMessage("loginMessage", "Login link sent! Check your email.");
  }

  async function checkOrganiserLogin() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
      document.getElementById("organiserSection").classList.add("hidden");
      document.getElementById("adminPanel").classList.remove("hidden");
    }
  }

  async function logoutOrganiser() {
    await supabaseClient.auth.signOut();
    document.getElementById("adminPanel").classList.add("hidden");
    document.getElementById("organiserSection").classList.remove("hidden");
    showMessage("loginMessage", "You have logged out.");
  }

  async function createDraw() {
    const title = document.getElementById("exchangeTitle").value.trim();
    const budget = document.getElementById("budget").value.trim();
    const exchange_date =
      document.getElementById("exchangeDate").value || null;

    const participants = document.getElementById("participants").value
      .split("\n")
      .map(name => name.trim())
      .filter(Boolean);

    if (participants.length < 2) {
      showMessage("drawMessage", "Please enter at least two participants.");
      return;
    }

    if (!confirm("Are you sure? This gift draw can only be created once.")) {
      return;
    }

    const { data: sessionData } = await supabaseClient.auth.getSession();

    if (!sessionData.session) {
      showMessage("drawMessage", "Please log in as organiser first.");
      return;
    }

    showMessage("drawMessage", "Creating your gift draw...");

    const { data, error } = await supabaseClient.functions.invoke(
      FUNCTION_NAME,
      {
        body: {
          action: "create_draw",
          title,
          budget,
          exchange_date,
          participants
        }
      }
    );

    if (error || data?.error) {
      showMessage("drawMessage", data?.error || error.message);
      return;
    }

    if (!data?.locked || !Array.isArray(data.codes)) {
      showMessage("drawMessage", "Unexpected response. Please contact support.");
      return;
    }

    document.getElementById("participants").disabled = true;
    document.getElementById("pinResults").classList.remove("hidden");

    document.getElementById("pinResults").textContent =
      "DRAW CREATED — SAVE THESE PRIVATE PINS\n\n" +
      data.codes.map(person => person.name + " : " + person.pin).join("\n") +
      "\n\nGive each PIN privately to its participant. These PINs will not be shown again.";

    showMessage("drawMessage", "Your draw is locked. No second draw is allowed.");
  }

  checkOrganiserLogin();
  async function revealResult() {
    const name = document.getElementById("participantName").value.trim();
    const pin = document.getElementById("participantPin").value.trim();

    if (!name || !pin) {
      showMessage("participantMessage", "Enter your name and PIN.");
      return;
    }

    document.getElementById("result").classList.add("hidden");
    document.getElementById("hideResultButton").classList.add("hidden");

    showMessage("participantMessage", "Checking your details...");

    const { data, error } = await supabaseClient.functions.invoke(
      FUNCTION_NAME,
      {
        body: {
          action: "redeem",
          name,
          pin
        }
      }
    );

    if (error || data?.error) {
      showMessage(
        "participantMessage",
        data?.error || error.message
      );
      return;
    }

    document.getElementById("participantMessage").classList.add("hidden");

    showMessage(
      "result",
      "✦ YOUR GIFT RECIPIENT ✦\n\n" +
      data.recipient +
      "\n\nExchange: " + (data.title || "Golden Gift Exchange") +
      "\nBudget: " + (data.budget || "Not specified") +
      "\nDate: " + (data.exchange_date || "Not specified")
    );

    document.getElementById("hideResultButton").classList.remove("hidden");
  }

  function hideResult() {
    document.getElementById("participantName").value = "";
    document.getElementById("participantPin").value = "";
    document.getElementById("result").classList.add("hidden");
    document.getElementById("hideResultButton").classList.add("hidden");
    document.getElementById("participantMessage").classList.add("hidden");
  }
</script>
</body>
</html>

</script>
</body>
</html>

</body>
</html>
